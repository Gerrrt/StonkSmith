<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="StonkSmith">
  <title>StonkSmith</title>

  <!-- Solid panel rather than a transparent background: GitHub renders this
       mark on a white canvas in the light theme and a near-black one in dark,
       and a transparent mark has to be legible on both. Painting the ground
       here means only one contrast has to be got right. -->
  <rect width="128" height="128" rx="28" fill="#131722"/>

  <!-- The line goes up and to the right, behind everything else. -->
  <g fill="none" stroke="#2ecc71" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="16,104 36,82 50,94 70,56 84,68 103,36"/>
  </g>
  <path d="M113 23 L91 30 L106 45 Z" fill="#2ecc71"/>

  <!-- Ears, drawn before the head so the head's fill closes their bases. -->
  <path d="M36 58 L44 30 L58 54 Z" fill="#c8813a"/>
  <path d="M92 58 L84 30 L70 54 Z" fill="#c8813a"/>
  <path d="M42 55 L46 39 L54 54 Z" fill="#8d5326"/>
  <path d="M86 55 L82 39 L74 54 Z" fill="#8d5326"/>

  <ellipse cx="64" cy="70" rx="30" ry="26" fill="#e0a458"/>
  <ellipse cx="64" cy="80" rx="17" ry="13" fill="#f6e7cd"/>

  <circle cx="53" cy="66" r="3.6" fill="#1b1b1b"/>
  <circle cx="75" cy="66" r="3.6" fill="#1b1b1b"/>
  <ellipse cx="64" cy="76" rx="5" ry="3.8" fill="#1b1b1b"/>
  <path d="M64 80 v4 M64 84 q-5 4 -9 0 M64 84 q5 4 9 0"
        fill="none" stroke="#1b1b1b" stroke-width="2" stroke-linecap="round"/>

  <!-- Suit, starting at the jaw so the collar closes the head rather than
       overlapping it. -->
  <path d="M30 128 L40 108 L64 96 L64 128 Z" fill="#37415c"/>
  <path d="M98 128 L88 108 L64 96 L64 128 Z" fill="#37415c"/>
  <path d="M64 96 L52 110 L64 128 L76 110 Z" fill="#f2f5fa"/>
  <path d="M64 104 L58 112 L64 128 L70 112 Z" fill="#c0392b"/>
</svg>
