[project]
dependencies = [
    "beautifulsoup4>=4.12",
    "google-auth>=2.0",
    "gspread>=6.1",
    "keyring>=25.0",
    "parsel>=1.9",
    "playwright>=1.52",
    # 1.x imports pkg_resources, which no longer exists on Python 3.14.
    "playwright-stealth>=2",
    "requests>=2.33.1",
    "rich>=13.7",
    "snaptrade-python-sdk>=12.0.4",
    "sqlalchemy>=2.0.49",
    "tabulate>=0.9",
    "termcolor>=2.4",
]
description = "A tool that aggregates investment account data, written in python."
name = "stonksmith"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
stonksmith = "main:cli_entry"
stonksmithdb = "etc.stonksmithdb:main"

[dependency-groups]
dev = [ "pytest>=9.0.3", "ruff>=0.15.11", "ty>=0.0.32" ]

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[tool.hatch.build.targets.wheel]
include = [ "src" ]
sources = [ "src" ]

[tool.pytest.ini_options]
pythonpath = [ "src" ]
testpaths = [ "tests" ]

[tool.ruff]
src = [ "src", "tests" ]
# py313, not py314, even though requires-python is >=3.14. Under py314 the
# formatter rewrites `except (A, B):` into `except A, B:` -- Python 2 syntax that
# CPython refuses to parse. It is not a style preference we can decline: ruff's
# py314 parser accepts the broken form, so `ruff check`, `ruff format --check`
# and `ty` all pass on a file that no longer imports, and the whole gate goes
# green over a package that cannot start. That is how four of these reached main
# (config.py and normalize.py, fixed in this commit).
#
# Reproduce with: ruff format --isolated --target-version py314 on any
# parenthesized multi-type except. Reproduced on 0.15.11, 0.15.12 and 0.16.0, so
# upgrading is not the fix today. py310 through py313 are all unaffected.
#
# target-version only gates which syntax modernizations ruff considers safe, so
# holding it one version back costs nothing this codebase uses. Raise it once
# ruff formats py314 without emitting syntax errors.
target-version = "py313"

[tool.ruff.lint]
# Correctness-focused. Docstring (D) and annotation (ANN) rules are deliberately
# left off: the codebase predates linting and enabling them produces hundreds of
# findings that would keep CI permanently red without catching real bugs.
select = [ "B", "C4", "E", "F", "I", "RUF", "SIM", "UP", "W" ]

[tool.ruff.lint.per-file-ignores]
# The template is illustrative; its unused args are the point.
"src/modules/example.py" = [ "B", "RUF" ]

[tool.ty.environment]
root = [ "./src" ]

[tool.ty.src]
# Tests monkeypatch methods with MagicMock, which no type checker can verify.
# pytest is the gate for tests; ty is the gate for src.
# scripts/ are one-off operator tools, not part of the shipped package: they are
# run by hand, some via `uv run --with <pkg>` against dependencies StonkSmith
# does not install, and none of them is imported by src.
exclude = [ "tests", "scripts" ]
