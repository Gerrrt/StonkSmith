[project]
dependencies = [
    "beautifulsoup4>=4.12",
    "google-auth>=2.56.3",
    # Only the DFAS pay table needs this, and only because requests cannot
    # fetch it: dfas.mil refuses urllib3's TLS handshake whatever headers ride
    # on top of it. See brokers/tsp/broker.py for what was measured.
    "httpx>=0.28",
    "gspread>=6.1",
    "keyring>=25.0",
    "parsel>=1.9",
    "playwright>=1.62.0",
    # 1.x imports pkg_resources, which no longer exists on Python 3.14.
    "playwright-stealth>=2",
    # Reads TSP quarterly statements, which are the only place a unit count
    # is stated without a login.
    "pypdf>=6.15.0",
    "requests>=2.34.2",
    "rich>=13.7",
    "snaptrade-python-sdk>=12.1.0",
    "sqlalchemy>=2.0.51",
    "tabulate>=0.9",
    "termcolor>=2.4",
]
description = "A tool that aggregates investment account data, written in python."
name = "stonksmith"
readme = "README.md"
requires-python = ">=3.14"
version = "0.1.0"

[project.scripts]
stonksmith = "stonksmith.main:cli_entry"
stonksmithdb = "stonksmith.etc.stonksmithdb:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pytest-xdist>=3.8",
    "ruff>=0.16.2",
    "ty>=0.0.69",
]

[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[tool.hatch.build.targets.wheel]
# `packages`, not `include` + `sources`. The latter pair does not declare a package
# root: `sources` strips the "src" prefix, so every child of src/ was installed at
# the top level of site-packages -- `etc`, `helpers`, `modules`, `loaders`,
# `brokers`, `main`. Naming the package directory instead ships exactly one name.
packages = [ "src/stonksmith" ]

[tool.pytest.ini_options]
addopts = [ "-ra", "--strict-config", "--strict-markers" ]
# A warning the suite does not notice is a warning that becomes a breakage on
# some later dependency bump, so "error" fails the suite on every one of them.
#
# That single entry does more than it looks. Python ignores ResourceWarning by
# default, so promoting warnings to errors is what takes an unclosed sqlite
# connection from invisible to fatal -- and the suite passes under it only
# because shutdown_db() disposes its engine. Such a warning is raised during
# finalisation, with no test running to pin it on, so an ignore added back here
# would not be quieting a known problem; it would be hiding the next one.
filterwarnings = [ "error" ]
pythonpath = [ "src" ]
testpaths = [ "tests" ]
xfail_strict = true

[tool.coverage.run]
branch = true
# The template is never executed; it exists to be read and copied.
omit = [ "src/stonksmith/modules/example.py" ]
source = [ "src" ]

[tool.coverage.report]
exclude_also = [ "if TYPE_CHECKING:", "raise NotImplementedError" ]
show_missing = true

[tool.ruff]
# 88 is ruff's default; stated so a future default change cannot silently
# reflow every file in the repo.
line-length = 88
src = [ "src", "tests" ]
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
# Correctness-focused, plus a ratchet of rule sets that were already clean on
# src/ when they were added -- they cost nothing to adopt and stop the
# corresponding mistakes from ever landing.
#
# Docstring (D) and annotation (ANN) rules are deliberately left off. D is 1505
# findings and the payoff is presentational. ANN is 79 -- affordable, but the
# gap is concentrated in older files and closing it is its own piece of work
# rather than a side effect of this list.
#
# ISC001 is documented as conflicting with the formatter: it can flag string
# concatenation the formatter itself produced. ISC is clean today and ruff
# raises no warning for this pairing, so the whole group is selected. If that
# conflict ever surfaces, ignore ISC001 and keep ISC002/ISC003, which are where
# the value is.
select = [
    # correctness
    "B",
    "C4",
    "E",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
    "W",
    # ratchet
    "A",
    "ASYNC",
    "C90",
    "ERA",
    "EXE",
    "FA",
    "ICN",
    "INP",
    "INT",
    "ISC",
    "LOG",
    "PIE",
    "PYI",
    "Q",
    "RSE",
    "SLF",
    "SLOT",
    "PERF",
    "PTH",
    "RET",
    "TID",
    "YTT",
]

[tool.ruff.lint.mccabe]
# 16 is what the worst function in src/ scores today (error_shape, in
# browser_connection.py). Set here as a ceiling rather than an aspiration: it
# cannot be met by accident, and it stops anything new from being worse than the
# worst thing already here. Lowering it towards 10 is a refactor of ten named
# functions, which is its own piece of work and not a lint setting.
max-complexity = 16

[tool.ruff.lint.per-file-ignores]
# The template is illustrative; its unused args are the point.
"src/stonksmith/modules/example.py" = [ "B", "RUF" ]
# INP001 wants an __init__.py here. It should not have one: these are hand-run
# operator tools, not part of the shipped package -- the same reason [tool.ty.src]
# excludes them.
"scripts/*" = [ "INP" ]
# Reaching past an underscore is what a test of internal behaviour does. SLF
# stays on for src/, which is where it earns its place.
"tests/*" = [ "SLF" ]

[tool.ty.environment]
root = [ "./src" ]

[tool.ty.src]
# Tests monkeypatch methods with MagicMock, which no type checker can verify.
# pytest is the gate for tests; ty is the gate for src.
# scripts/ are one-off operator tools, not part of the shipped package: they are
# run by hand, some via `uv run --with <pkg>` against dependencies StonkSmith
# does not install, and none of them is imported by src.
exclude = [ "tests", "scripts" ]
