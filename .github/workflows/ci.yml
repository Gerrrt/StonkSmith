name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Stated rather than inherited. Without a permissions block the job gets the
    # repository default, which on an older repository is write on every scope --
    # and pull_request runs carry that token on a workflow any fork's PR can
    # influence through uv.lock and the dependency tree. This job checks out,
    # installs, lints, type checks and tests: it writes nothing.
    permissions:
      contents: read
    steps:
      # Pinned to commits, not tags. A tag is a pointer its owner can move at
      # any time, onto any commit, and whatever it lands on runs here with this
      # repository checked out. The trailing comment is the human-readable
      # version; dependabot keeps both halves in step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Test
        # keyring has no usable backend on a headless runner; the credential
        # tests install an in-memory backend, and this stops the import-time
        # backend probe from picking something interactive.
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        # The floor is the measured baseline (89.83%) rounded down, not a target.
        # It lives here rather than in [tool.coverage.report] so that running
        # `pytest --cov` over a handful of files locally does not fail on it.
        # Raise it when the real number moves; never lower it to make CI pass.
        run: uv run pytest -q --cov --cov-fail-under=89
