name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Format check
        run: uv run ruff format --check

      - name: Type check
        run: uv run ty check

      - name: Test
        # keyring has no usable backend on a headless runner; the credential
        # tests install an in-memory backend, and this stops the import-time
        # backend probe from picking something interactive.
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: uv run pytest -q
