[STONKSMITH]
workspace = default
last_used_db =
audit_mode = False
reveal_chars_of_pwd = False
log_mode = False
host_info_colors = ("green", "red", "yellow", "cyan")

# Client id for the SnapTrade broker. Not a secret: the consumer key it pairs
# with lives in the OS keyring, put there by scripts/snaptrade_register.py.
# A personal API key needs nothing else -- SnapTrade resolves the user from the
# key itself, so there is no userId or userSecret.
#
# Accounts SnapTrade should not sync because another broker already covers
# them. One "Brokerage / Account" label per line, indented under the option --
# exactly as the sync prints them. Without this, an account reachable both ways
# is written twice, into two tabs, and any total that adds the tabs up counts
# the money twice.
#
#   exclude_accounts =
#       Schwab / Ezekiel 529 Plan
#
# Excluding is not the only fix and not always the right one: where SnapTrade
# is the better source, stop running the other broker instead.
[SNAPTRADE]
clientid =
exclude_accounts =

# TSP needs no login. A balance is units x share price: prices are published
# daily and public, and units only move when a transaction posts. So the daily
# run has no credential in it and nothing that can expire.
#
# fund
#   The fund held, spelled as the price file spells it: "L 2060", "C Fund".
#
# units / units_as_of
#   "Closing Units" from your most recent quarterly statement, and the date it
#   was true. Both are reported with every mark, so a value carried on an old
#   unit count says how old rather than looking current. Units change only when
#   a contribution, transfer, loan or withdrawal posts.
#
#   To refresh them without waiting for a statement, pass a balance read off
#   the TSP site and the "Balance as of" date beside it:
#
#       --balance 7810.84 --balance-as-of 2026-08-05
#
#   The site never states a unit count, but a balance is units x that day's
#   price, so the division inverts it exactly. The run prints the count it
#   derives, ready to paste back into units / units_as_of here. There is no
#   balance option in this file on purpose: a balance is true for one day, so
#   storing it would leave a value that silently rots.
#
# price_url
#   Where to download the share price history. Leave blank and pass --prices
#   with a downloaded copy instead -- which is also the answer when the machine
#   cannot reach tsp.gov.
[TSP]
fund =
units =
units_as_of =
price_url =
