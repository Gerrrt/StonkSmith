[STONKSMITH]
workspace = default
last_used_db =
audit_mode = False
reveal_chars_of_pwd = False
log_mode = False
host_info_colors = ("green", "red", "yellow", "cyan")

# Client id for the SnapTrade broker. Not a secret: the consumer key it pairs
# with lives in the OS keyring, put there by scripts/snaptrade_register.py.
# A personal API key needs nothing else -- SnapTrade resolves the user from the
# key itself, so there is no userId or userSecret.
#
# Accounts SnapTrade should not sync because another broker already covers
# them. One "Brokerage / Account" label per line, indented under the option --
# exactly as the sync prints them. Without this, an account reachable both ways
# is written twice, into two tabs, and any total that adds the tabs up counts
# the money twice.
#
#   exclude_accounts =
#       Schwab / Beneficiary A 529 Plan
#
# Excluding is not the only fix and not always the right one: where SnapTrade
# is the better source, stop running the other broker instead.
[SNAPTRADE]
clientid =
exclude_accounts =

# TSP needs no login. A balance is units x share price: prices are published
# daily and public, and units only move when a transaction posts. So the daily
# run has no credential in it and nothing that can expire.
#
# fund
#   The fund held, spelled as the price file spells it: "L 2060", "C Fund".
#
# units / units_as_of
#   "Closing Units" from your most recent quarterly statement, and the date it
#   was true. Both are reported with every mark, so a value carried on an old
#   unit count says how old rather than looking current. Units change only when
#   a contribution, transfer, loan or withdrawal posts.
#
#   To refresh them without waiting for a statement, pass a balance read off
#   the TSP site and the "Balance as of" date beside it:
#
#       --balance 8409.71 --balance-as-of 2026-08-05
#
#   The site never states a unit count, but a balance is units x that day's
#   price, so the division inverts it exactly. The run prints the count it
#   derives, ready to paste back into units / units_as_of here. There is no
#   balance option in this file on purpose: a balance is true for one day, so
#   storing it would leave a value that silently rots.
#
# price_url
#   Where to download the share price history. Leave it blank: the published
#   URL is built in, and fund + units are all this broker needs to run. Set it
#   only if TSP moves the file, which is the one part of this that can change
#   without warning -- a URL here is fixable without waiting for a release.
#
#   To value the account without reaching tsp.gov at all, pass --prices with a
#   copy of the file downloaded by hand.
#
# rank / basd / member_contribution / agency_contribution
#   Optional, and all four together or not at all. Filled in, they let a run
#   account for the contributions that have posted since the unit count was
#   true, instead of carrying a count that is short by one of them per month.
#
#   Basic pay is published by DFAS per pay grade and time in service, so a grade
#   and a service date name a monthly figure exactly; the two percentages turn
#   it into dollars, and the day's share price turns those into units.
#
#       rank = E-7
#       basd = 2016-03-14
#       member_contribution = 5
#       agency_contribution = 5
#
#   rank is the pay grade, not the title: "E-7", "O-3", "W-2", or "O-3E" for an
#   officer with over four years of enlisted or warrant service. basd is the
#   Basic Active Service Date in YYYY-MM-DD, and time in service is counted from
#   it to the day. Both percentages are of monthly basic pay, written either as
#   a bare number or with a percent sign: "5" and "5%" mean the same thing.
#
#   What this adds is an estimate, and it is reported as one on every line and
#   in the database rather than folded into a number that looks exact. It
#   assumes contributions come out of basic pay alone -- not special, incentive
#   or bonus pay -- and it does not know about the IRS elective deferral limit,
#   so a member who reaches the annual cap will be over-accrued until the next
#   statement resets the count. Leave these blank and the mark stays anchored to
#   units alone, exactly as it was.
#
# contribution_day
#   Which day of the month the contribution posts, since that is the day whose
#   share price it buys at. Blank means the last day of the month. A day past
#   the end of a short month is clamped to it, so 31 works in February.
#
# pay_table_url
#   Where to read the DFAS pay tables. Leave it blank: the published URL is
#   built in. Set it only if DFAS moves them. To accrue without reaching
#   dfas.mil at all, pass --pay-table with a copy of the page saved by hand,
#   or --no-accrual to value the anchored unit count on its own.
[TSP]
fund =
units =
units_as_of =
price_url =
rank =
basd =
member_contribution =
agency_contribution =
contribution_day =
pay_table_url =

# Accounts you can see but cannot scrape, valued the way TSP is: a unit count
# you supply, multiplied by a price the market publishes.
#
# The case this exists for is an account with no API, no scrapeable site and no
# way out except a transfer -- a plan portal that shows a balance and a fund and
# offers nothing else. Leaving it out makes every total short by its value while
# looking complete, which is the failure this project keeps designing against.
#
# **What is stored is units, never a balance**, and that is the whole design.
# The [TSP] section above says why in one line: a balance is true for one day,
# so storing it would leave a value that silently rots. Units move only when
# money goes in or out, so an account nobody is funding has a unit count that
# stays exactly right while its value moves daily with the market. A hardcoded
# balance would be correct the morning it was typed and wrong every morning
# after, and would flatten that slice of the net worth chart while looking
# entirely like data.
#
# accounts
#   One "Name | SYMBOL | units | units_as_of" per line, indented under the
#   option. The symbol is whatever the chart feed knows the fund by, the same
#   one Ally's --from-prices reprices against.
#
#       accounts =
#           Sam Custodial | VOO | 1.842 | 2026-08-14
#
#   To derive the unit count from a balance, divide it by that day's published
#   close -- a balance is units x price, so the division inverts it exactly. The
#   run prints the count it would derive if you pass --balance with
#   --balance-as-of, ready to paste back here.
#
#   units_as_of is the date the count was true, and it is reported on every mark
#   rather than folded away. An account valued on a count from four months ago
#   is right if nothing has been paid in and wrong by exactly what has, and the
#   date is the only way for a reader to judge which.
[MANUAL]
accounts =

# What you call your accounts, where that differs from what the broker calls
# them. Nothing here changes a single stored number: this is a display name, and
# it is applied on the way out of the databases so the sheet and the brief say
# the same thing.
#
# Worth having because the names a broker chooses are written for the broker's
# own screens. "ACME CORPORATION SAVINGS PLUS 401(K) PLAN" and "Individual
# (...1234)" are both perfectly correct and neither is what you call the account
# at half past six in the morning.
#
# aliases
#   One "Source / Account = Your name" per line, indented under the option. The
#   left-hand side is the "Source / Account" label the run prints and the sheet
#   shows -- the same spelling [SNAPTRADE] exclude_accounts uses, so a label
#   copied from one works in the other.
#
#       aliases =
#           tsp / TSP L 2060 = Alex 401(k)
#           Fidelity / ACME CORPORATION SAVINGS PLUS 401(K) = Robin 401(k)
#           ally / Individual (...1234) = Joint Brokerage (Ally)
#
#   Split on the *last* "=" so a broker name may contain one. A line matching no
#   account in the workspace is reported by the run rather than ignored, so a
#   broker that renames an account tells you the alias has stopped landing
#   instead of quietly reverting to the broker's own wording.
#   Whose account it is, for the brief to colour by. One "Match = colour" per
#   line, indented under the option. The match is checked against the account's
#   display name -- the one aliases above produce -- case-insensitively, as a
#   substring, and the first line that matches wins. So one line covers every
#   account a person holds:
#
#       colors =
#           Alex = green
#           Robin = pink
#           Sam = blue
#           Joint = yellow
#
#   The colour is a dot beside the name, never the only thing carrying meaning:
#   the name it sits next to already says whose account it is, so this is a
#   scanning aid rather than information. A page where colour is the only
#   difference between two rows is unreadable to about one man in twelve, and
#   this deliberately is not one.
#
#   Named colours only, from: green, pink, blue, yellow, orange, purple, grey.
#   Anything else is reported and dropped rather than passed through, because the
#   value reaches an HTML class attribute and a config file is not a stylesheet.
#
# cost_basis
#   What you paid, for accounts whose source will not say. One
#   "Source / Account = amount" per line, indented under the option, keyed the
#   same way aliases above are -- and against the label the *broker* gave, not
#   the alias, so the two settings read alike.
#
#       cost_basis =
#           schwab529plan / Sam = 1300.00
#           tsp / TSP L 2060 = 6100
#           Fidelity / ACME CORPORATION SAVINGS PLUS 401(K) PLAN = $45,000
#
#   Needed because three kinds of account report a balance and no cost, each for
#   its own reason. A Fidelity 401k reaches SnapTrade carrying units and price
#   and nothing else. A scraped 529 arrives as a bare balance with no symbol at
#   all. And the TSP unit count is anchored to a figure off a quarterly
#   statement, so the only units whose cost is known are the ones accrued since
#   -- and reporting those as the basis would put a five-figure balance against a
#   few hundred dollars and print a gain of some two thousand percent.
#
#   Stating it fills in purchase price, gain, growth, yield on cost and the
#   win/loss flag for that holding, which are all computed from it. Leave a line
#   out and that holding keeps showing a dash, which is the honest reading of a
#   cost nobody has stated: a zero would report the position's whole value as
#   profit, beside what is often the largest number on the page.
#
#   "$1,300.00" and "1300" are both read. A negative amount is refused rather
#   than clamped, since it would inverse the sign of the growth percentage.
#
#   This never overwrites a cost a broker did report. What SnapTrade returns is
#   a real average over real lots and what this is is a figure typed off a
#   statement, so where both exist the source wins and the line is reported as
#   unused -- otherwise a config left in place would quietly diverge from a
#   broker that had been right all along.
#
#   Applied only when the account has exactly one holding with no cost. An
#   account holding three would need the total split between them, and a split
#   invented from a lump sum decides the per-position gains it appears to
#   report. Those lines are reported and skipped instead.
[ACCOUNTS]
aliases =
colors =
cost_basis =

# The dashboard's third allocation block, and the only one you have to supply
# anything for. Account kind and position are both already in the database;
# asset class is in neither, because no source states one -- SnapTrade gives a
# ticker, a scraped 529 gives a fund code, TSP gives a fund. So the tab does not
# guess: it groups by what you declare here and names the rest.
#
# asset_classes
#   One "SYMBOL = Class" per line, indented under the option. The symbol is the
#   Holdings tab's "Symbol" column -- a ticker, a fund code or a TSP fund -- and
#   it is matched exactly as the source spelled it, case and all. A line that
#   matches nothing in the workspace is reported by the run, so a typo says so
#   instead of quietly classifying nothing. The class name is yours: "US Stock",
#   "Bond", "Real Estate", whatever the split you actually think in is.
#
#       asset_classes =
#           VTI = US Stock
#           VXUS = International Stock
#           C Fund = US Stock
#           G Fund = Bond
#
#   Anything held and not listed lands in one "(unclassified)" slice rather than
#   being dropped, because a breakdown that silently omits a position is one
#   whose shares no longer add up. Uninvested cash is a named slice too, exactly
#   as it is in the by-position block.
#
#   Leave this blank and the block is not drawn at all. A breakdown that is one
#   100% "(unclassified)" wedge tells you nothing, and an empty region on the tab
#   looks like a write that failed.
[ALLOCATION]
asset_classes =

# The morning brief: `stonksmithdb brief`, and the LaunchAgent in
# scripts/com.stonksmith.morning.plist that runs it at half past six.
#
# It reads the databases and nothing else -- no login, no broker, no network --
# and reports what has changed since the last brief you were shown, which is not
# the same as since the last scrape. A morning you skip is still covered by the
# next one.
#
# open_browser
#   Whether to open the rendered file when it is written. False renders it and
#   says where, which is what you want if you would rather open it yourself, and
#   what the LaunchAgent needs set to True to be a reminder at all.
#
# keep_days
#   How many days of rendered briefs to keep in ~/.stonksmith/reports. One small
#   file per day the brief ran; older ones are deleted as each new one is
#   written. Set it to 0 to keep every brief forever -- they are the only record
#   of what you were actually shown on a given morning, which the databases
#   cannot reconstruct once the baseline has moved past it.
#
# movers
#   How many accounts and how many positions the brief has room for. The list is
#   ordered by the size of the move in dollars, so this is a cutoff on a ranking
#   rather than a filter on a threshold.
#
# min_position
#   The smallest position that earns a row in the holdings table. A settlement
#   account leaves a few cents of a sweep fund beside a real holding, and it
#   renders as a full row with a dash in every derived column -- true, and not a
#   holding anybody is tracking. Display only: whatever falls below this is still
#   counted in every total, and the number hidden is stated under the table. Set
#   it to 0 to show everything.
#
# fund_link
#   Where a holding's symbol links to. One URL with {symbol} in it. Leave it
#   blank for the built-in default, which is the quote page of the same feed the
#   tool already reads prices from.
#
#   Only a symbol that looks like a public ticker is linked -- one to five ASCII
#   letters, nothing else. That is what keeps a link off "Q4R7", "70310" and
#   "L 2060", which are a 401k fund code, a 529 portfolio number and a TSP fund:
#   real holdings with no public page to point at. A link that 404s is worse than
#   no link, because the reader has to click it to find that out.
#
#   Must begin with https:// and contain {symbol}, or it is refused and reported
#   -- the value lands in an href, and a config file is not a place for
#   "javascript:".
[BRIEF]
fund_link =
min_position = 1.00
open_browser = True
keep_days = 90
movers = 8
